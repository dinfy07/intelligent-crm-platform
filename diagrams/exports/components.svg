<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#43546b" stroke-width="1.4"/></marker><marker id="general" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#43546b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="44" y="48" font-family="Arial" font-size="25" fill="#122138" font-weight="700">Draft components · Proposed architecture</text><rect x="35" y="170" width="260" height="135" rx="5" fill="#f2f5fb" stroke="#70829b" stroke-width="1.5"/><text x="165.0" y="201" font-family="Arial" font-size="18" text-anchor="middle" fill="#122138"><tspan x="165.0" dy="0">Web UI</tspan><tspan x="165.0" dy="25.2">Vue 3 / TypeScript</tspan><tspan x="165.0" dy="25.2">Beybit</tspan></text><rect x="430" y="145" width="330" height="190" rx="5" fill="#f2f5fb" stroke="#70829b" stroke-width="1.5"/><text x="595.0" y="176" font-family="Arial" font-size="18" text-anchor="middle" fill="#122138"><tspan x="595.0" dy="0">CRM API</tspan><tspan x="595.0" dy="25.2">FastAPI / Python</tspan><tspan x="595.0" dy="25.2">Danial</tspan><tspan x="595.0" dy="25.2">Access, import, jobs, reviews, export</tspan></text><rect x="900" y="170" width="260" height="145" rx="5" fill="#f2f5fb" stroke="#70829b" stroke-width="1.5"/><text x="1030.0" y="201" font-family="Arial" font-size="18" text-anchor="middle" fill="#122138"><tspan x="1030.0" dy="0">PostgreSQL</tspan><tspan x="1030.0" dy="25.2">Customers, turns, jobs, runs,</tspan><tspan x="1030.0" dy="25.2">reviews and audit</tspan></text><rect x="430" y="470" width="330" height="180" rx="5" fill="#f2f5fb" stroke="#70829b" stroke-width="1.5"/><text x="595.0" y="501" font-family="Arial" font-size="18" text-anchor="middle" fill="#122138"><tspan x="595.0" dy="0">Analysis worker</tspan><tspan x="595.0" dy="25.2">Python / Akhmediyar</tspan><tspan x="595.0" dy="25.2">Lease jobs and method adapter</tspan><tspan x="595.0" dy="25.2">Validate schema and source refs</tspan></text><rect x="35" y="495" width="260" height="125" rx="5" fill="#f2f5fb" stroke="#70829b" stroke-width="1.5"/><text x="165.0" y="526" font-family="Arial" font-size="18" text-anchor="middle" fill="#122138"><tspan x="165.0" dy="0">Pinned local model</tspan><tspan x="165.0" dy="25.2">or deterministic baseline</tspan></text><rect x="900" y="495" width="260" height="125" rx="5" fill="#fff8ed" stroke="#70829b" stroke-width="1.5"/><text x="1030.0" y="526" font-family="Arial" font-size="18" text-anchor="middle" fill="#122138"><tspan x="1030.0" dy="0">Optional hosted model</tspan><tspan x="1030.0" dy="25.2">Disabled by default</tspan></text><path d="M295,235 H428" fill="none" stroke="#43546b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="361" y="196" font-family="Arial" font-size="15" text-anchor="middle" fill="#122138"><tspan x="361" dy="0">HTTP JSON</tspan><tspan x="361" dy="21.0">polling</tspan></text><path d="M760,235 H898" fill="none" stroke="#43546b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="830" y="217" font-family="Arial" font-size="15" text-anchor="middle" fill="#122138"><tspan x="830" dy="0">SQL</tspan></text><path d="M760,545 H830 V285 H898" fill="none" stroke="#43546b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="940" y="395" font-family="Arial" font-size="15" text-anchor="middle" fill="#122138"><tspan x="940" dy="0">SQL leases and runs</tspan></text><path d="M430,554 H297" fill="none" stroke="#43546b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="362" y="532" font-family="Arial" font-size="15" text-anchor="middle" fill="#122138"><tspan x="362" dy="0">Local inference</tspan></text><path d="M760,596 H898" fill="none" stroke="#43546b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="829" y="634" font-family="Arial" font-size="15" text-anchor="middle" fill="#122138"><tspan x="829" dy="0">Optional inference</tspan></text><text x="600" y="724" font-family="Arial" font-size="17" text-anchor="middle" fill="#122138"><tspan x="600" dy="0">Job identity includes source hash, method version and configuration.</tspan><tspan x="600" dy="23.799999999999997">Durable attempts and immutable runs. Bounded retries. No Redis or broker in the initial design.</tspan></text></svg>
